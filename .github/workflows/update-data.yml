name: Refresh Air Quality & Bias Data

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System GDAL/GEOS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Fetch Latest OpenAQ Indian PM2.5 Stations
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          python pipeline/fetch_openaq.py

      - name: Recompute Spatial Bias & Silent Zones
        run: |
          python pipeline/fetch_districts.py

      - name: Run Spatial & Data Quality Audit
        run: |
          python pipeline/spatial_audit.py

      - name: Commit and Push Updated GeoJSON Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/stations.geojson data/processed/districts.geojson
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-refresh India air quality stations [skip ci]"
            git push
          else
            echo "No data changes detected. Skipping commit."
          fi
